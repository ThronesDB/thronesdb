# Apache settings for the app container. It sits behind a reverse proxy
# (nginx or similar) on the host, which terminates TLS.

ServerName localhost
ServerTokens Prod
ServerSignature Off

# public/.htaccess carries Symfony's front-controller rewrite rules
<Directory ${APACHE_DOCUMENT_ROOT}>
    AllowOverride All
    Require all granted
</Directory>

# Requests arrive from the proxy, so log the client address it forwarded.
# The default site uses this format (set in the Dockerfile).
LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" proxied

# Each mod_php worker holds a full PHP interpreter; cap them so the container's
# memory stays bounded. Tune with APACHE_MAX_WORKERS.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild  1000
</IfModule>
