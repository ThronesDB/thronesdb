; Loaded after php.ini-production (copied to php.ini in the Dockerfile).

; Under mod_php, the container's environment variables only reach PHP through
; $_ENV, and only when "E" is in variables_order. Symfony reads APP_ENV,
; DATABASE_URL etc. from there, so real env vars win over the .env file.
variables_order = "EGPCS"

memory_limit = 256M
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; 0 in production: code only changes when the image is rebuilt.
; The dev compose file sets PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 so edits show up.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}

realpath_cache_size = 4096K
realpath_cache_ttl = 600
