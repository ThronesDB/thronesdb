security:
    password_hashers:
        # FOSUserBundle accounts were hashed with salted SHA-512 (5000 rounds,
        # base64). Keep verifying those; new and changed passwords use the
        # current default algorithm, and old hashes are upgraded on login.
        legacy_sha512:
            algorithm: sha512
            encode_as_base64: true
            iterations: 5000
        FOS\UserBundle\Model\UserInterface:
            algorithm: auto
            migrate_from:
                - legacy_sha512

    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    providers:
        fos_userbundle:
            id: fos_user.user_provider.username_email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # OAuth2: clients exchange codes and refresh tokens here, no session
        oauth_token:
            pattern: ^/oauth/v2/token$
            security: false

        # The OAuth2-protected API: a bearer token, no session
        api_oauth2:
            pattern: ^/api/oauth2
            stateless: true
            oauth2: true

        main:
            pattern: ^/
            lazy: true
            provider: fos_userbundle
            form_login:
                login_path: fos_user_security_login
                check_path: fos_user_security_check
                enable_csrf: true
                default_target_path: index
                always_use_default_target_path: false
            logout:
                path: fos_user_security_logout
            remember_me:
                secret: '%env(APP_SECRET)%'
                lifetime: 31536000 # one year
                path: /

    # Only the first matching rule applies
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/resetting, roles: PUBLIC_ACCESS }
        - { path: ^/remind, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/v2/auth, roles: IS_AUTHENTICATED_REMEMBERED }
        - { path: ^/admin/, roles: ROLE_ADMIN }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/oauth2/user, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/oauth2/decks, roles: ROLE_READ_DECK }
        - { path: ^/api/oauth2/deck/load, roles: ROLE_READ_DECK }
        - { path: ^/api/oauth2/deck/save, roles: ROLE_WRITE_DECK }
        - { path: ^/js/, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/deck/view/, roles: PUBLIC_ACCESS }
        - { path: ^/deck/, roles: ROLE_USER }
        - { path: ^/decks, roles: ROLE_USER }
        - { path: ^/user/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            FOS\UserBundle\Model\UserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
