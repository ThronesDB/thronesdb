# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    assets:
        json_manifest_path: "%kernel.project_dir%/public/manifest.json"
    default_locale: '%locale%'
    translator: { fallbacks: ['%locale%'] }
    secret: '%env(APP_SECRET)%'
    form: ~
    csrf_protection: true
    validation: ~
    annotations: false
    http_method_override: true
    handle_all_throwables: true
    # Behind a reverse proxy: trust its X-Forwarded-* headers. A comma-separated
    # list of addresses or ranges in TRUSTED_PROXIES; empty trusts none.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']
    session:
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_secure: auto
        cookie_samesite: lax
    fragments: true
    php_errors:
        log: true
