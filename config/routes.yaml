# Routes from bundles. The app's own controllers are in routes/attributes.yaml.

# Account pages (login, registration, password reset, profile), in both languages
fos_user_security:
    resource: '@FOSUserBundle/Resources/config/routing/security.php'
    host: { en: '%website_url%', es: 'es.%website_url%' }

fos_user_profile:
    resource: '@FOSUserBundle/Resources/config/routing/profile.php'
    prefix: /profile
    host: { en: '%website_url%', es: 'es.%website_url%' }

fos_user_register:
    resource: '@FOSUserBundle/Resources/config/routing/registration.php'
    prefix: /register
    host: { en: '%website_url%', es: 'es.%website_url%' }

fos_user_resetting:
    resource: '@FOSUserBundle/Resources/config/routing/resetting.php'
    prefix: /resetting
    host: { en: '%website_url%', es: 'es.%website_url%' }

fos_user_change_password:
    resource: '@FOSUserBundle/Resources/config/routing/change_password.php'
    prefix: /profile
    host: { en: '%website_url%', es: 'es.%website_url%' }

# OAuth2 server: /oauth/v2/authorize and /oauth/v2/token, on any hostname
oauth2:
    resource: '@LeagueOAuth2ServerBundle/config/routes.php'
    type: php
    prefix: /oauth/v2

# The authorize path FOSOAuthServerBundle used, kept for existing clients
oauth2_authorize_legacy:
    path: /oauth/v2/auth
    controller: league.oauth2_server.controller.authorization::indexAction
